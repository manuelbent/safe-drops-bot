name: Deploy to Ionos Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}

      - name: Copy files to Ionos server
        run: scp -r ./* root@${{ secrets.IONOS_HOST }}:/var/www/safe-drops-bot/

      - name: Install dependencies
        run: |
          cd /var/www/safe-drops-bot
          npm ci

      - name: Restart server
        run: | 
          cd /var/www/safe-drops-bot
          pm2 restart all