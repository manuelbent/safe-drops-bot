name: Deploy to Ionos

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Ionos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}

      - name: Deploy to Ionos server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }} << 'EOF'
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          cd /var/www/safe-drops-bot
          git pull
          nvm install
          export NODE_EXECUTABLE="$(command -v node)"
          npm ci
          npm run build
          npm run migrate:up
          npm i -g pm2
          pm2 startOrRestart ecosystem.config.js --update-env
          EOF
